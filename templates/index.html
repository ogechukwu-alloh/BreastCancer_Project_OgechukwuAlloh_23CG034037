<!DOCTYPE html>
<html>
<head>
    <title>Breast Cancer Classification</title>
</head>
<body>
    <h2>Breast Cancer Prediction System</h2>
    <p><i>Educational use only. Not a medical diagnostic tool.</i></p>

    <form method="post">
        Mean Radius: <input type="number" step="any" name="radius" required><br><br>
        Mean Texture: <input type="number" step="any" name="texture" required><br><br>
        Mean Perimeter: <input type="number" step="any" name="perimeter" required><br><br>
        Mean Area: <input type="number" step="any" name="area" required><br><br>
        Mean Smoothness: <input type="number" step="any" name="smoothness" required><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h3>Prediction Result: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
